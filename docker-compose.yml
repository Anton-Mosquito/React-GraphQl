services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c listen_addresses='*'

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    # Команда спочатку пушить схему в БД, потім запускає сервер
    command: sh -c "npx prisma db push --accept-data-loss && npm run dev"
    ports:
      - "5001:5001"
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/client/build # Щоб не перетирати білд клієнта, якщо він там є (опціонально)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://dev:dev@db:5432/appdb?schema=public
      - NODE_ENV=development
      - CLIENT_URL=http://localhost:80
      - API_URL=${API_URL}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_API_BASE_URL=${TMDB_API_BASE_URL}
      - TMDB_IMAGE_BASE_PATH=${TMDB_IMAGE_BASE_PATH}
      - MAIL_USER=${MAIL_USER}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_REFRESH_TOKEN=${OAUTH_REFRESH_TOKEN}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    # Run Vite in host-accessible mode and expose port 3000 for nginx
    command: sh -c "npm run dev -- --host 0.0.0.0"
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - app-network
    environment:
      - WATCHPACK_POLLING=true # Допомагає з Hot Reload на деяких системах
      - HOST=0.0.0.0
      - VITE_API_URL=/api
      - VITE_WEBSOCKET_URL=${VITE_WEBSOCKET_URL}

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf.dev:/etc/nginx/conf.d/default.conf
    depends_on:
      - server
      - client
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: